name: Android Phone + Google Services + Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Cloud Phone
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ANDROID_CONTAINER: dockerify-android
      WEB_CONTAINER: scrcpy-web
      ANDROID_IMAGE: shmayro/dockerify-android:latest
      WEB_IMAGE: shmayro/scrcpy-web:latest

    steps:
      ####################################################################
      # System Information
      ####################################################################

      - name: Show runner information
        run: |
          echo "Runner architecture:"
          uname -a

          echo ""
          echo "CPU information:"
          lscpu | grep -E 'Architecture|CPU\(s\)|Model name|Virtualization' || true

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

      ####################################################################
      # Verify KVM
      ####################################################################

      - name: Verify KVM acceleration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is not available."
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          echo "KVM device:"
          ls -la /dev/kvm

          echo ""
          echo "Virtualization flags:"
          grep -E -m1 'vmx|svm' /proc/cpuinfo || {
            echo "::error::CPU virtualization extensions are unavailable."
            exit 1
          }

      ####################################################################
      # Install Required Tools
      ####################################################################

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            android-tools-adb \
            curl \
            jq

          adb version
          docker version

      ####################################################################
      # Connect to Tailscale
      ####################################################################

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          use-cache: "true"

      - name: Detect Tailscale address
        id: tailscale
        shell: bash
        run: |
          set -euo pipefail

          TS_IP=""

          for attempt in $(seq 1 30); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -n1 || true)"

            if [ -n "$TS_IP" ]; then
              break
            fi

            echo "Waiting for Tailscale address... ${attempt}/30"
            sleep 2
          done

          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale did not assign an IPv4 address."
            tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "ip=$TS_IP" >> "$GITHUB_OUTPUT"

          echo "Tailscale IPv4: $TS_IP"
          tailscale status || true

      ####################################################################
      # Prepare Docker
      ####################################################################

      - name: Prepare Docker network and storage
        shell: bash
        run: |
          set -euo pipefail

          docker network create android-network || true
          docker volume create android-data

          docker network inspect android-network
          docker volume inspect android-data

      ####################################################################
      # Download Images
      ####################################################################

      - name: Pull Android images
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${ANDROID_IMAGE}"
          docker pull "${WEB_IMAGE}"

          docker images \
            --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      ####################################################################
      # Start Android
      ####################################################################

      - name: Start Android emulator
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f "${ANDROID_CONTAINER}" 2>/dev/null || true

          docker run -d \
            --name "${ANDROID_CONTAINER}" \
            --hostname android-phone \
            --network android-network \
            --privileged \
            --device /dev/kvm:/dev/kvm \
            --restart unless-stopped \
            --shm-size 2g \
            -p "${TAILSCALE_IP}:5555:5555" \
            -v android-data:/data \
            -e DNS="one.one.one.one" \
            -e RAM_SIZE="4096" \
            -e SCREEN_RESOLUTION="1080x2400" \
            -e SCREEN_DENSITY="420" \
            -e GAPPS_SETUP="1" \
            -e ARM_TRANSLATION="1" \
            -e ROOT_SETUP="0" \
            "${ANDROID_IMAGE}"

          echo "Android container started:"
          docker ps --filter "name=${ANDROID_CONTAINER}"

      ####################################################################
      # Wait for Android
      ####################################################################

      - name: Wait for Android boot
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Android initialization."
          echo "The first boot can take 10-15 minutes because GApps"
          echo "and ARM translation are being installed."

          for attempt in $(seq 1 150); do
            CONTAINER_STATE="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "${ANDROID_CONTAINER}" 2>/dev/null || true
            )"

            HEALTH_STATE="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "${ANDROID_CONTAINER}" 2>/dev/null || true
            )"

            echo "Attempt ${attempt}/150 | container=${CONTAINER_STATE} | health=${HEALTH_STATE}"

            if [ "$CONTAINER_STATE" != "running" ]; then
              echo "::error::Android container stopped unexpectedly."
              docker logs "${ANDROID_CONTAINER}" --tail 300 || true
              exit 1
            fi

            if [ "$HEALTH_STATE" = "healthy" ]; then
              echo "Android container is healthy."
              break
            fi

            if [ "$attempt" -eq 150 ]; then
              echo "::error::Android did not become healthy."
              docker logs "${ANDROID_CONTAINER}" --tail 500 || true
              exit 1
            fi

            if (( attempt % 10 == 0 )); then
              docker logs "${ANDROID_CONTAINER}" --tail 25 || true
            fi

            sleep 10
          done

      ####################################################################
      # Start Scrcpy Web
      ####################################################################

      - name: Start browser interface
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f "${WEB_CONTAINER}" 2>/dev/null || true

          docker run -d \
            --name "${WEB_CONTAINER}" \
            --hostname android-web \
            --network android-network \
            --privileged \
            --restart unless-stopped \
            -p "${TAILSCALE_IP}:8000:8000" \
            "${WEB_IMAGE}" \
            sh -c '
              echo "Waiting for Android ADB..."

              until adb connect dockerify-android:5555; do
                sleep 3
              done

              adb devices

              exec npm start
            '

          docker ps

      ####################################################################
      # Verify ADB and Android Properties
      ####################################################################

      - name: Verify Android system
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          adb kill-server || true
          adb start-server

          for attempt in $(seq 1 60); do
            adb connect "${TAILSCALE_IP}:5555" || true

            DEVICE_STATE="$(
              adb -s "${TAILSCALE_IP}:5555" get-state 2>/dev/null || true
            )"

            if [ "$DEVICE_STATE" = "device" ]; then
              break
            fi

            echo "Waiting for ADB device... ${attempt}/60"
            sleep 5
          done

          if [ "$DEVICE_STATE" != "device" ]; then
            echo "::error::ADB device is not ready."
            docker logs "${ANDROID_CONTAINER}" --tail 300 || true
            exit 1
          fi

          echo ""
          echo "Android version:"
          adb -s "${TAILSCALE_IP}:5555" shell getprop ro.build.version.release

          echo ""
          echo "Android SDK:"
          adb -s "${TAILSCALE_IP}:5555" shell getprop ro.build.version.sdk

          echo ""
          echo "Supported CPU architectures:"
          adb -s "${TAILSCALE_IP}:5555" shell getprop ro.product.cpu.abilist

          echo ""
          echo "Device model:"
          adb -s "${TAILSCALE_IP}:5555" shell getprop ro.product.model

          echo ""
          echo "Boot status:"
          adb -s "${TAILSCALE_IP}:5555" shell getprop sys.boot_completed

          echo ""
          echo "Google packages:"
          adb -s "${TAILSCALE_IP}:5555" shell \
            pm list packages | grep -E 'google|gms|vending' || true

      ####################################################################
      # Verify Web Interface
      ####################################################################

      - name: Verify Scrcpy Web
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            HTTP_CODE="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 3 \
                "http://${TAILSCALE_IP}:8000" || true
            )"

            echo "Web check ${attempt}/60: HTTP ${HTTP_CODE}"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "Scrcpy Web is ready."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Scrcpy Web did not become ready."
          docker logs "${WEB_CONTAINER}" --tail 300 || true
          exit 1

      ####################################################################
      # Connection Information
      ####################################################################

      - name: Show connection information
        shell: bash
        run: |
          {
            echo "## 📱 Android Cloud Phone"
            echo ""
            echo "Android is running successfully."
            echo ""
            echo "### Browser"
            echo ""
            echo "\`http://${TAILSCALE_IP}:8000\`"
            echo ""
            echo "### ADB"
            echo ""
            echo "\`\`\`bash"
            echo "adb connect ${TAILSCALE_IP}:5555"
            echo "\`\`\`"
            echo ""
            echo "### Configuration"
            echo ""
            echo "- Android: 11"
            echo "- Resolution: 1080 × 2400"
            echo "- Density: 420 DPI"
            echo "- Pico GApps: enabled"
            echo "- ARM/ARM64 translation: enabled"
            echo "- Root: disabled"
            echo "- Access: Tailscale only"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "================================================"
          echo "ANDROID CLOUD PHONE IS READY"
          echo "================================================"
          echo ""
          echo "Web:"
          echo "http://${TAILSCALE_IP}:8000"
          echo ""
          echo "ADB:"
          echo "adb connect ${TAILSCALE_IP}:5555"
          echo ""

      ####################################################################
      # Keep Runner Alive
      ####################################################################

      - name: Keep Android online
        shell: bash
        run: |
          set +e

          end_time=$((SECONDS + 19800))

          while [ "$SECONDS" -lt "$end_time" ]; do
            echo ""
            echo "================================================"
            date -u
            echo "================================================"

            docker ps \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            ANDROID_RUNNING="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${ANDROID_CONTAINER}" 2>/dev/null
            )"

            WEB_RUNNING="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${WEB_CONTAINER}" 2>/dev/null
            )"

            if [ "$ANDROID_RUNNING" != "true" ]; then
              echo "::warning::Android stopped. Attempting restart..."
              docker restart "${ANDROID_CONTAINER}"
            fi

            if [ "$WEB_RUNNING" != "true" ]; then
              echo "::warning::Web interface stopped. Attempting restart..."
              docker restart "${WEB_CONTAINER}"
            fi

            HTTP_CODE="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 3 \
                "http://${TAILSCALE_IP}:8000"
            )"

            echo "Web status: HTTP ${HTTP_CODE}"
            echo "URL: http://${TAILSCALE_IP}:8000"

            sleep 60
          done

      ####################################################################
      # Save Logs
      ####################################################################

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          mkdir -p android-logs

          docker logs "${ANDROID_CONTAINER}" \
            > android-logs/android.log 2>&1 || true

          docker logs "${WEB_CONTAINER}" \
            > android-logs/scrcpy-web.log 2>&1 || true

          docker inspect "${ANDROID_CONTAINER}" \
            > android-logs/android-inspect.json 2>&1 || true

          docker inspect "${WEB_CONTAINER}" \
            > android-logs/web-inspect.json 2>&1 || true

          adb devices -l \
            > android-logs/adb-devices.txt 2>&1 || true

          tailscale status \
            > android-logs/tailscale-status.txt 2>&1 || true

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cloud-phone-logs-${{ github.run_id }}
          path: android-logs
          retention-days: 3
