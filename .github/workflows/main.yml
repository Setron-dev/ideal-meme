name: RDP via Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Cloudflare"
          netsh advfirewall firewall add rule name="RDP-Cloudflare" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Static Password
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "TOOLBOXLAP"

          if (-not (Get-LocalUser -Name "TOOLBOXLAP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          $cfPath = "C:\cloudflared.exe"

          Invoke-WebRequest -Uri $cfUrl -OutFile $cfPath
          & $cfPath --version

      - name: Verify RDP Accessibility
        run: |
          $testResult = Test-NetConnection -ComputerName "localhost" -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity to local RDP port 3389 successful!"

      - name: Maintain Connection (Cloudflare Tunnel)
        run: |
          $cfPath = "C:\cloudflared.exe"
          $logOut = "$env:TEMP\cloudflared.out"
          $logErr = "$env:TEMP\cloudflared.err"
          if (Test-Path $logOut) { Remove-Item $logOut -Force }
          if (Test-Path $logErr) { Remove-Item $logErr -Force }

          $proc = Start-Process -FilePath $cfPath -ArgumentList "tunnel","--url","rdp://localhost:3389" -RedirectStandardOutput $logOut -RedirectStandardError $logErr -PassThru -WindowStyle Hidden

          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              $content = @()
              if (Test-Path $logOut) { $content += Get-Content $logOut }
              if (Test-Path $logErr) { $content += Get-Content $logErr }
              $text = $content -join "`n"
              if ($text -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                  $url = $Matches[0]
                  break
              }
          }

          if (-not $url) {
              Write-Host "=== cloudflared stdout ==="
              if (Test-Path $logOut) { Get-Content $logOut }
              Write-Host "=== cloudflared stderr ==="
              if (Test-Path $logErr) { Get-Content $logErr }
              Write-Error "Cloudflare Tunnel URL not found"
              exit 1
          }

          $hostName = $url -replace "https://", ""

          Write-Host ""
          Write-Host "=== RDP ACCESS (Cloudflare) ==="
          Write-Host "Tunnel URL : $url"
          Write-Host ""
          Write-Host "On your PC (client), run:"
          Write-Host "  cloudflared access rdp --hostname $hostName --url rdp://localhost:3390"
          Write-Host ""
          Write-Host "Then open Remote Desktop (mstsc) and connect to: localhost:3390"
          Write-Host "Username : TOOLBOXLAP"
          Write-Host "Password : admin@123"
          Write-Host "==============================="
          Write-Host ""

          while ($true) {
              if ($proc.HasExited) {
                  Write-Error "cloudflared process exited unexpectedly."
                  if (Test-Path $logErr) { Get-Content $logErr -Tail 20 }
                  exit 1
              }
              Write-Host "[$(Get-Date)] RDP Active via Cloudflare - Tunnel: $url"
              Start-Sleep -Seconds 300
          }