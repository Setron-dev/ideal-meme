name: AnyDesk Remote Access
on:
  workflow_dispatch:
jobs:
  anydesk:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Install AnyDesk (silent)
        run: |
          $adUrl = "https://download.anydesk.com/AnyDesk.exe"
          $adInstaller = "C:\AnyDesk.exe"
          Invoke-WebRequest -Uri $adUrl -OutFile $adInstaller
          & $adInstaller --install "C:\AnyDesk" --silent
          Start-Sleep -Seconds 5
          if (-not (Test-Path "C:\AnyDesk\AnyDesk.exe")) {
              Write-Error "AnyDesk installation failed"
              exit 1
          }
          Write-Host "AnyDesk installed."

      - name: Configure Unattended Access (password)
        run: |
          $adExe = "C:\AnyDesk\AnyDesk.exe"
          & $adExe --set-password "admin@123"
          Start-Sleep -Seconds 3
          $id = & $adExe --get-id
          Write-Host "ANYDESK_ID=$id"
          echo "ANYDESK_ID=$id" >> $env:GITHUB_ENV

      - name: Show Connection Info
        run: |
          Write-Host ""
          Write-Host "=== ANYDESK ACCESS ==="
          Write-Host "AnyDesk ID : $env:ANYDESK_ID"
          Write-Host "Password   : admin@123"
          Write-Host "======================"
          Write-Host ""
          Write-Host "On your device (AnyDesk app), enter the ID above and the password."

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] AnyDesk Active - ID: $env:ANYDESK_ID"
              Start-Sleep -Seconds 300
          }