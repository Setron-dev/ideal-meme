name: Android Docker + Tailscale Web

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Install Dependencies
      ####################################################################

      - name: Install KVM Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            qemu-kvm \
            curl \
            wget

          sudo chmod 666 /dev/kvm || true

          ls -la /dev/kvm || true

      ####################################################################
      # Install Tailscale
      ####################################################################

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          tailscale version

      ####################################################################
      # Connect Tailscale
      ####################################################################

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=android-gh-${{ github.run_id }}

          TS_IP=""

          for i in {1..10}; do
            TS_IP=$(tailscale ip -4 | head -n 1)

            if [ ! -z "$TS_IP" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      ####################################################################
      # Pull Android Docker
      ####################################################################

      - name: Pull Android Docker Image
        run: |
          docker pull budtmo/docker-android:emulator_13.0

      ####################################################################
      # Start Android Emulator
      ####################################################################

      - name: Start Android Container
        run: |
          docker run -d \
            --name android \
            --device /dev/kvm \
            -p 6080:6080 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            -e EMULATOR_GPU="swiftshader_indirect" \
            budtmo/docker-android:emulator_13.0

      ####################################################################
      # Wait Emulator Boot
      ####################################################################

      - name: Wait Android Startup
        run: |
          echo "Waiting Android emulator..."

          sleep 120

          docker ps

      ####################################################################
      # Verify Web Access
      ####################################################################

      - name: Verify Web Interface
        run: |
          curl http://127.0.0.1:6080 || true

          echo "Android Web UI should be available"

      ####################################################################
      # Show Access Information
      ####################################################################

      - name: Show Connection Info
        run: |
          echo ""
          echo "====================================="
          echo "ANDROID IS RUNNING"
          echo "====================================="
          echo ""

          echo "Tailscale IP:"
          echo "${{ env.TAILSCALE_IP }}"

          echo ""
          echo "WEB URL:"
          echo "http://${{ env.TAILSCALE_IP }}:6080"
          echo ""

          echo "ADB COMMAND:"
          echo "adb connect ${{ env.TAILSCALE_IP }}:5555"
          echo ""

      ####################################################################
      # Keep Alive
      ####################################################################

      - name: Keep Runner Alive
        run: |
          while true
          do
            echo "=============================="
            date
            docker ps
            echo "=============================="

            sleep 60
          done
